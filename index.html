<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Rubik's Cube</title>
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #111; color: white; }
    #cube { width: 300px; height: 300px; position: relative; transform-style: preserve-3d; transform: rotateX(-30deg) rotateY(30deg); }
    .face { position: absolute; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); border: 1px solid #333; box-sizing: border-box; }
    .front  { transform: rotateY(  0deg) translateZ(150px); background: red; }
    .back   { transform: rotateY(180deg) translateZ(150px); background: orange; }
    .right  { transform: rotateY( 90deg) translateZ(150px); background: green; }
    .left   { transform: rotateY(-90deg) translateZ(150px); background: blue; }
    .top    { transform: rotateX( 90deg) translateZ(150px); background: white; }
    .bottom { transform: rotateX(-90deg) translateZ(150px); background: yellow; }
  </style>
</head>
<body>
  <div id="cube">
    <div class="face front"></div>
    <div class="face back"></div>
    <div class="face right"></div>
    <div class="face left"></div>
    <div class="face top"></div>
    <div class="face bottom"></div>
  </div>
  <script>
    let cube = document.getElementById('cube');
    let isDragging = false, startX, startY, currentX = -30, currentY = -30;
    function updateCube() {
      cube.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
    }
    cube.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });
    cube.addEventListener('mousemove', (e) => {
      if (isDragging) {
        currentX -= (e.clientY - startY) * 0.5;
        currentY += (e.clientX - startX) * 0.5;
        updateCube();
        startX = e.clientX;
        startY = e.clientY;
      }
    });
    cube.addEventListener('mouseup', () => { isDragging = false; });
    cube.addEventListener('mouseleave', () => { isDragging = false; });
    cube.addEventListener('touchstart', (e) => {
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    cube.addEventListener('touchmove', (e) => {
      if (isDragging) {
        currentX -= (e.touches[0].clientY - startY) * 0.5;
        currentY += (e.touches[0].clientX - startX) * 0.5;
        updateCube();
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }
    });
    cube.addEventListener('touchend', () => { isDragging = false; });
    updateCube();
  </script>
</body>
</html>
